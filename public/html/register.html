<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>ChatApp - Register</title>
    <link rel="stylesheet" href="../styles/chat.css" />
    <link rel="stylesheet" href="../styles/register.css" />
  </head>
  <body>
    <div class="register-container">
      <h2 class="register-title">Register</h2>
      <div>
        <input id="username" placeholder="Username" class="input-field" />
        <input id="email" placeholder="Email" class="input-field" />
        <input
          id="password"
          placeholder="Password"
          type="password"
          class="input-field"
        />
        <label>Avatar (optional)</label><br />
        <input id="avatar" type="file" accept="image/*" class="file-input" />
        <button id="regBtn" class="register-btn">Register</button>
        <p class="login-link">
          Already have account? <a href="./login.html">Login</a>
        </p>
        <div id="msg" class="error-msg"></div>
      </div>
    </div>

    <script>
      document.getElementById("regBtn").onclick = async () => {
        const username = document.getElementById("username").value;
        const email = document.getElementById("email").value;
        const password = document.getElementById("password").value;
        const avatarInput = document.getElementById("avatar");
        const form = new FormData();
        form.append("username", username);
        form.append("email", email);
        form.append("password", password);
        if (avatarInput.files[0]) form.append("avatar", avatarInput.files[0]);
        const res = await fetch("/api/register", {
          method: "POST",
          body: form,
        });
        const text = await res.text();
        // console.log("Server response:", text);
        try {
          const data = JSON.parse(text);
          if (res.ok) {
            localStorage.setItem("CHAT_TOKEN", data.token);
            location.href = "/html/chat.html";
          } else {
            document.getElementById("msg").innerText =
              data.error || "Register error";
          }
        } catch (error) {
          document.getElementById("msg").innerText = "Invalid server response";
        }
      };
    </script>
  </body>
</html>
