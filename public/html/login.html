<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>ChatApp - Login</title>
    <link rel="stylesheet" href="../styles/chat.css" />
    <link rel="stylesheet" href="../styles/login.css" />
  </head>
  <body>
    <div class="login-container">
      <h2 class="login-title">Login</h2>
      <div>
        <label>Email</label><br />
        <input id="email" type="email" class="input-field" />

        <label>Password</label><br />
        <input id="password" type="password" class="input-field" />

        <button id="loginBtn" class="login-btn">Login</button>

        <p class="register-link">
          No account? <a href="./register.html">Register</a>
        </p>

        <div id="msg" class="error-msg"></div>
      </div>
    </div>

    <script>
      document.getElementById("loginBtn").onclick = async () => {
        const email = document.getElementById("email").value;
        const password = document.getElementById("password").value;
        const res = await fetch("/api/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ email, password }),
        });
        const text = await res.text();
        // console.log("Server response:", text);
        try {
          const data = JSON.parse(text);
          if (res.ok) {
            localStorage.setItem("CHAT_TOKEN", data.token);
            location.href = "/html/chat.html";
          } else {
            document.getElementById("msg").innerText =
              data.error || "Login error";
          }
        } catch (error) {
          document.getElementById("msg").innerText = "Invalid server response";
        }
      };
    </script>
  </body>
</html>
