<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>ChatApp - Register</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div
      style="
        max-width: 420px;
        margin: 40px auto;
        padding: 20px;
        background: #fff;
        border-radius: 12px;
      "
    >
      <h2 style="color: #b6281b; margin: 0 0 12px">Register</h2>
      <div>
        <input
          id="username"
          placeholder="Username"
          style="width: 100%; padding: 10px; margin: 6px 0"
        />
        <input
          id="email"
          placeholder="Email"
          style="width: 100%; padding: 10px; margin: 6px 0"
        />
        <input
          id="password"
          placeholder="Password"
          type="password"
          style="width: 100%; padding: 10px; margin: 6px 0"
        />
        <label>Avatar (optional)</label><br />
        <input id="avatar" type="file" accept="image/*" style="margin: 6px 0" />
        <button
          id="regBtn"
          style="
            width: 100%;
            padding: 10px;
            margin-top: 12px;
            background: #b6281b;
            color: white;
            border: none;
          "
        >
          Register
        </button>
        <p style="margin-top: 8px">
          Already have account? <a href="/login.html">Login</a>
        </p>
        <div id="msg" style="color: red"></div>
      </div>
    </div>

    <script>
      document.getElementById("regBtn").onclick = async () => {
        const username = document.getElementById("username").value;
        const email = document.getElementById("email").value;
        const password = document.getElementById("password").value;
        const avatarInput = document.getElementById("avatar");
        const form = new FormData();
        form.append("username", username);
        form.append("email", email);
        form.append("password", password);
        if (avatarInput.files[0]) form.append("avatar", avatarInput.files[0]);
        const res = await fetch("/api/register", {
          method: "POST",
          body: form,
        });
        const data = await res.json();
        if (res.ok) {
          localStorage.setItem("CHAT_TOKEN", data.token);
          location.href = "/chat.html";
        } else {
          document.getElementById("msg").innerText =
            data.error || "Register error";
        }
      };
    </script>
  </body>
</html>
